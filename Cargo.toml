[package]
name = "ssh-tunnel"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "glow", "default_fonts"]}
egui = { version = "0.37.0", default-features = false, features = ["default_fonts"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dirs = "7.0.0"

ssh2-config = { git = "https://github.com/veeso/ssh2-config", tag = "v0.7.1", default-features = false }
russh = { version = "0.65.0", default-features = false, features = ["flate2", "ring", "rsa"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
anyhow = "1.0.104"
log = "0.4.34"
log4rs = "1.4"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
strip = "symbols"
lto = true
panic = "abort"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", features = ["wayland"] }


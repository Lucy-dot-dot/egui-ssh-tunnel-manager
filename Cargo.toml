[package]
name = "ssh-tunnel"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts"]}
egui = { version = "0.35.0", default-features = false, features = ["default_fonts"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
dirs = "6.0.0"

ssh2-config = { git = "https://github.com/veeso/ssh2-config", tag = "v0.7.1", default-features = false }
russh = { version = "0.62.2", default-features = false, features = ["flate2", "ring", "rsa"] }
tokio = { version = "1.53.0", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
anyhow = "1.0.104"
log = "0.4"
log4rs = "1.4"

[profile.release]
strip = "symbols"
lto = true
panic = "abort"
